{% extends 'categorias_front/base.html' %}

{% block title %}Editar Categoria{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h2 class="mb-3">Editar Categoria</h2>

        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Guardar Categoria</button>
            <a href="{% url 'lista_categorias' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
