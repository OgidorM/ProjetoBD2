{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Cinema BD2{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'lista_filmes' %}">Cinema BD2</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'lista_filmes' %}">Filmes</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lista_salas' %}">Salas</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lista_lugares' %}">Lugares</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lista_bilhetes' %}">Bilhetes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-3">
    Cinema BD2
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block content %}{% endblock %}
</body>
</html>
