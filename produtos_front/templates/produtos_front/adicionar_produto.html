{% extends 'produtos_front/base.html' %}

{% block title %}Adicionar Produto{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Adicionar Produto</h2>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.nomeproduto.id_for_label }}" class="form-label">Nome do Produto</label>
            {{ form.nomeproduto }}
        </div>
        <div class="mb-3">
            <label for="{{ form.precoproduto.id_for_label }}" class="form-label">Preço (€)</label>
            {{ form.precoproduto }}
        </div>
        <div class="mb-3">
            <label for="{{ form.stock.id_for_label }}" class="form-label">Stock</label>
            {{ form.stock }}
        </div>
        <div class="mb-3 form-check">
            {{ form.ativo }}
            <label for="{{ form.ativo.id_for_label }}" class="form-check-label">Produto Ativo</label>
        </div>
        <button type="submit" class="btn btn-success">Guardar Produto</button>
        <a href="{% url 'lista_produtos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
