<!DOCTYPE html>
<html>
<head><title>{% if mode == 'create' %}Create Client{% else %}Edit Client{% endif %}</title></head>
<body>
  <h1>{% if mode == 'create' %}Create Client{% else %}Edit Client{% endif %}</h1>
  <div style="margin-bottom:12px;">
    <a href="/">← Home</a>
    <a href="{% url 'clientes:list' %}" style="margin-left:8px;">← Lista</a>
    {% if client %}<a href="{% url 'clientes:detail' client.clienteid %}?format=json" style="margin-left:8px;">Ver JSON</a>{% endif %}
  </div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% if client %}{% url 'clientes:detail' client.clienteid %}{% else %}{% url 'clientes:list' %}{% endif %}">Cancel</a>
  </form>
  <div style="margin-top:16px;">
    <a href="{% url 'clientes:list' %}">← Voltar para lista</a>
  </div>
</body>
</html>
