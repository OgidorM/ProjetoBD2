{% extends 'classificacoesetarias_front/base.html' %}
{% block title %}Adicionar Classificação Etária{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Adicionar Nova Classificação Etária</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Salvar Classificação</button>
                    <a href="{% url 'lista_classificacoesetarias' %}" class="btn btn-secondary ms-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
