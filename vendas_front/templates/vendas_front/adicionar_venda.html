{% extends 'vendas_front/base.html' %}

{% block title %}Adicionar Venda{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Adicionar Venda</h2>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.clienteid.id_for_label }}" class="form-label">Cliente</label>
            {{ form.clienteid }}
        </div>
        <div class="mb-3">
            <label for="{{ form.funcionarioid.id_for_label }}" class="form-label">Funcionário</label>
            {{ form.funcionarioid }}
        </div>
        <div class="mb-3">
            <label for="{{ form.data.id_for_label }}" class="form-label">Data</label>
            {{ form.data }}
        </div>
        <div class="mb-3">
            <label for="{{ form.estadovenda.id_for_label }}" class="form-label">Estado da Venda</label>
            {{ form.estadovenda }}
        </div>
        <div class="mb-3">
            <label for="{{ form.totalvenda.id_for_label }}" class="form-label">Total (€)</label>
            {{ form.totalvenda }}
        </div>
        <button type="submit" class="btn btn-success">Guardar Venda</button>
        <a href="{% url 'lista_vendas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
