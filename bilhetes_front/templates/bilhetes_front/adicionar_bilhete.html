{% extends 'bilhetes_front/base.html' %}

{% block title %}Adicionar Bilhete{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Adicionar Bilhete</h2>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            Sessao
            {{ form.sessaoid }}
        </div>
        <div class="mb-3">
            Lugar
            {{ form.lugarid }}
        </div>
        <div class="mb-3">
            Preço
            {{ form.precobilhete }}
        </div>
        <div class="mb-3">
            Emissão
            {{ form.emissao }}
        </div>
        <button type="submit" class="btn btn-success">Guardar Bilhete</button>
        <a href="{% url 'lista_bilhetes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
